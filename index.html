<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Simulador educacional do ciclo Order-to-Cash do SAP SD: VA01, VL01N, VF01 e NF-e.">
<style>html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>SAPTutor SD</title>
<style>
/* Layout: site web responsivo (até 1180px; duas colunas no desktop, uma no celular). Modo Clássico imita o SAP GUI. Barra de status e mentor fixos no rodapé. */
:root{
  /* SAP Fiori · tema Quartz Light (tema único e claro, como no SAP) */
  --bg:#F5F6F7; --surface:#FFFFFF; --sunk:#F7F7F7; --fg:#32363A; --muted:#6A6D70; --line:#D9D9D9; --field:#89919A;
  --accent:#0A6ED1; --accent-ink:#FFFFFF; --accent-soft:#E5F0FA; --accent-dark:#0854A0; --shell:#354A5F;
  --mentor:#5B3FD9; --mentor-soft:#F1EEFF;
  --ok:#107E3E; --ok-soft:#F1FDF6; --err:#BB0000; --err-soft:#FFEBEB; --warn:#B95000; --warn-soft:#FEF7F1; --info:#0A6ED1; --info-soft:#F5FAFF;
  --display:"72","72full",Arial,Helvetica,sans-serif;
  --body:"72","72full",Arial,Helvetica,sans-serif;
  --mono:"72","72full",Arial,Helvetica,sans-serif;
  --code:Consolas,"Lucida Console",monospace;
  --gui:Tahoma,Arial,"Segoe UI",sans-serif;
  --r:4px;
  /* Modo SAP GUI: paleta fixa do tema Signature */
  --g-shell:#DFE8F1; --g-bar:#E4ECF4; --g-panel:#E9F0F7; --g-field:#FFFFFF; --g-border:#7F9DB9; --g-title:#0E2A55; --g-text:#000000; --g-hdr:#DCE5EF; --g-focus:#F0AB00; --g-link:#0B5394;
  color-scheme:light;
}
:root.is-classic{color-scheme:light}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--body);padding-inline:16px;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
code,.mono{font-family:var(--mono)}
#app{max-width:1180px;margin:0 auto;padding-block:8px 190px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- App chrome ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:36px;height:36px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 16px/1 var(--display);letter-spacing:.04em;flex:none}
.brand b{display:block;font:700 19px/1.1 var(--display);letter-spacing:.01em}
.brand small{display:block;color:var(--muted);font-size:12.5px;line-height:1.3}
.top-r{display:flex;align-items:center;gap:8px}
.seg{display:flex;background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.ic{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--mentor);background:var(--mentor-soft);color:var(--mentor);font-weight:700;display:grid;place-items:center;flex:none}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:6px 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 11px;font:500 13px/1.2 var(--mono);color:var(--muted)}
.tabs button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}

.scr-head{display:grid;gap:4px;margin-block:6px 14px}
.tc{justify-self:start;font:600 12px/1 var(--mono);letter-spacing:.06em;background:var(--accent-soft);color:var(--accent);padding:5px 8px;border-radius:6px}
.scr-head h1{font:700 28px/1.1 var(--display)}
.scr-head p{color:var(--muted);font-size:15px}

.stack{display:grid;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:16px}
fieldset.panel{margin:0;min-width:0}
.panel>legend,.sec-t{font:600 12px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
fieldset.panel>legend{padding:0 6px;margin-left:-6px}
.sec-t{margin-block:6px -4px}

.f{display:grid;gap:6px;min-width:0}
.lab{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-weight:600;font-size:14.5px}
.lab code{font-size:11px;font-weight:500;color:var(--muted);background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.ctl{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.f input,.f select,.ctl input{width:100%;height:48px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;background:var(--surface);color:var(--fg);font:500 17px/1 var(--mono)}
.f input:focus,.ctl input:focus,.f select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input.up{text-transform:uppercase}
input::placeholder{color:var(--muted);opacity:.55;text-transform:none}
input[readonly]{background:var(--sunk)}
input.bad{border-color:var(--err)!important;box-shadow:0 0 0 3px var(--err-soft)!important}
.desc{color:var(--muted);font-size:14px;min-height:0}
.desc:empty{display:none}
.help{color:var(--muted);font-size:13.5px;line-height:1.45}
output.val{display:block;font:500 17px/1.3 var(--mono);padding:12px;border-radius:10px;background:var(--sunk);border:1.5px dashed var(--line)}

.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{min-height:50px;padding:0 20px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);flex:1 1 220px}
.btn.wide{flex:1 1 100%}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px}
.btn.danger{color:var(--err);border-color:var(--err-soft)}
.lnk{border:0;background:none;color:var(--accent);font-weight:600;font-size:14px;padding:4px}

/* Itens */
.item{border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:12px;background:var(--sunk)}
.item-h{display:flex;align-items:center;gap:8px}
.item-h .pos{font:600 15px/1 var(--mono)}
.item-h code{font-size:11px;color:var(--muted)}
.item-h .lnk{margin-left:auto}
.item-g{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.item-g .f:first-child{grid-column:1/-1}
.ip{font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px;font-variant-numeric:tabular-nums}
.ip b{color:var(--fg);font-weight:600}
.cinfo{font-size:14px;color:var(--muted);display:grid;gap:2px;line-height:1.45}
.cinfo b{color:var(--fg);font-size:15px}
.cinfo:empty{display:none}

/* Totais */
.tot{display:grid;gap:12px}
.tot-main{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tot-main>div{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid}
.tot-main span{font-size:12.5px;color:var(--muted)}
.tot-main b{font:600 21px/1.25 var(--mono);font-variant-numeric:tabular-nums}
dl.kv{margin:0;display:grid;gap:6px;font-size:14px}
dl.kv>div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dotted var(--line);padding-bottom:5px}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
dl.kv .grand{border-bottom:0}
dl.kv .grand dt{color:var(--fg);font-weight:600}
dl.kv .grand dd{font-weight:600}

/* Home */
.hero{display:grid;gap:8px;margin-block:4px 4px}
.eyebrow{font:600 12px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.hero h1{font:700 32px/1.05 var(--display)}
.hero p{color:var(--muted)}
ol.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.step{display:grid;grid-template-columns:34px 1fr;gap:4px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.step .num{grid-row:span 3;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font:700 16px/1 var(--display);color:var(--muted)}
.step.done .num{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.step.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.step.cur .num{border-color:var(--accent);color:var(--accent)}
.step h3{font:600 17px/1.25 var(--body);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.step h3 code{font-size:12.5px;color:var(--accent)}
.step p{color:var(--muted);font-size:14px}
.step .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.cur{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.pend{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.md{display:grid;gap:0}
.md>div{display:grid;grid-template-columns:92px 1fr;gap:10px;padding-block:10px;border-top:1px solid var(--line)}
.md>div:first-child{border-top:0;padding-top:0}
.md dt{font-size:12px;color:var(--muted);line-height:1.35}
.md dt code{display:block;font-size:11px;margin-top:2px}
.md dd{margin:0;font-size:14.5px;min-width:0}
.md dd b{font-family:var(--mono);font-weight:600}
.md dd span{display:block;color:var(--muted);font-size:13.5px}
.done-banner{background:var(--ok-soft);border:1px solid var(--ok);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.done-banner b{color:var(--ok);font:700 20px/1.2 var(--display)}

/* Resultado */
.res{background:var(--ok-soft);border:1px solid var(--ok);border-radius:var(--r);padding:16px;display:grid;gap:10px;margin-bottom:14px}
.res .eyebrow{color:var(--ok)}
.res-n{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.res-n small{font-size:14px;color:var(--muted)}
.res-n b{font:600 30px/1 var(--mono);letter-spacing:.02em}
.res p{font-size:14.5px}
.meter{height:12px;border-radius:6px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.meter span{display:block;height:100%;width:var(--to);background:var(--ok);animation:drop 1.4s .3s cubic-bezier(.4,0,.2,1) backwards}
@keyframes drop{from{width:var(--from)}to{width:var(--to)}}
.stockline{display:flex;justify-content:space-between;font:500 14px/1.3 var(--mono);font-variant-numeric:tabular-nums}

/* Fluxo de documentos */
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;list-style:none;margin:0;padding:0}
.flow li{display:flex;align-items:center;gap:6px}
.flow li+li::before{content:"›";color:var(--muted);font-weight:600}
.flow span{background:var(--sunk);border:1px solid var(--line);border-radius:7px;padding:4px 8px;font-size:12.5px;line-height:1.25}
.flow span small{display:block;color:var(--muted);font-size:11px}
.flow span b{font-family:var(--mono);font-weight:600}

/* NF-e */
.nflist{display:grid;gap:8px}
.nfrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
.nfrow.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.nfrow b{font-family:var(--mono)}
.nfrow small{color:var(--muted);font-size:13px}
.nf-status{display:flex;align-items:center;gap:12px;border-radius:var(--r);padding:14px;border:1px solid var(--line);background:var(--sunk)}
.nf-status.auth{background:var(--ok-soft);border-color:var(--ok)}
.nf-status b{display:block;font:700 18px/1.2 var(--display)}
.nf-status.auth b{color:var(--ok)}
.nf-status small{display:block;color:var(--muted);font-size:13px}
.dot{width:14px;height:14px;border-radius:50%;flex:none;background:var(--ok)}
.spin{width:18px;height:18px;border-radius:50%;flex:none;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.key{font:500 14px/1.6 var(--mono);word-spacing:2px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.danfe{background:var(--surface);color:var(--fg);border:1.5px solid var(--fg);border-radius:2px;font-size:12.5px;display:grid}
.danfe .dh{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-bottom:1.5px solid var(--fg);align-items:center}
.danfe .dh strong{font:700 22px/1 var(--display);letter-spacing:.06em}
.danfe .dh span{font-size:11px;line-height:1.3;text-align:right}
.danfe .bx{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.danfe .bx>div{border-bottom:1px solid var(--fg);padding:5px 8px;min-width:0}
.danfe .bx>div:nth-child(odd){border-right:1px solid var(--fg)}
.danfe .bx>.full{grid-column:1/-1;border-right:0!important}
.danfe i{display:block;font-style:normal;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.danfe .v{font-family:var(--mono);font-size:12.5px;overflow-wrap:anywhere}
.danfe .t{padding:6px 8px 2px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;border-bottom:1px solid var(--fg)}

/* Tabelas */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.grid{border-collapse:collapse;width:100%;font:13px/1.35 var(--mono);font-variant-numeric:tabular-nums}
table.grid th{text-align:left;font:600 11.5px/1.2 var(--mono);color:var(--muted);background:var(--sunk);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.grid td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
table.grid tr:last-child td{border-bottom:0}
table.grid .r{text-align:right}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14.5px}
.se-pick{display:grid;gap:8px}
.cnt{color:var(--muted);font-size:13.5px}

/* Sugestões (auto-completar) */
.sug{position:fixed;z-index:60;list-style:none;margin:0;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px rgb(0 0 0 / .18);max-height:280px;overflow:auto}
.sug li{display:grid;grid-template-columns:auto 1fr;gap:0 10px;padding:9px 10px;border-radius:7px;cursor:pointer}
.sug li b{font:600 14px/1.3 var(--mono)}
.sug li span{font-size:14px;line-height:1.3}
.sug li small{grid-column:2;color:var(--muted);font-size:12.5px}
.sug li.act,.sug li:hover{background:var(--accent-soft)}
.sug .sug-h{display:block;padding:4px 10px 6px;font-size:11.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;cursor:default}
.sug .sug-h:hover{background:none}

/* Dock: mentor + barra de status */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:40;padding-inline:12px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));pointer-events:none}
.dock-in{max-width:1180px;margin:0 auto;display:grid;gap:8px}
#mentor{max-width:560px;width:100%;justify-self:end}
.dock-in>*{pointer-events:auto}
#mentor{display:grid;grid-template-columns:38px 1fr;gap:12px;background:var(--surface);border:1.5px solid var(--mentor);border-radius:14px;padding:12px 14px;box-shadow:0 12px 30px rgb(0 0 0 / .16);animation:pop .28s ease-out}
@keyframes pop{from{transform:translateY(10px);opacity:.4}to{transform:none;opacity:1}}
.m-av{width:38px;height:38px;border-radius:50%;background:var(--mentor);color:var(--surface);display:grid;place-items:center;font:700 15px/1 var(--display);letter-spacing:.04em}
.m-body{display:grid;gap:8px;min-width:0}
.m-body small{font:600 11.5px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--mentor)}
.m-body p{font-size:15px;line-height:1.45}
.m-act{display:flex;gap:8px}
.m-act button{border:1.5px solid var(--mentor);background:var(--mentor-soft);color:var(--fg);border-radius:8px;padding:6px 14px;font-weight:600;font-size:14px}
.status{display:flex;align-items:center;gap:10px;min-height:44px;padding:8px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:14px;line-height:1.35;box-shadow:0 4px 14px rgb(0 0 0 / .08)}
.status svg{flex:none}
.status .txt{min-width:0;flex:1}
.status .idle{color:var(--muted)}
.status.s{background:var(--ok-soft);border-color:var(--ok);color:var(--fg)}
.status.e{background:var(--err-soft);border-color:var(--err);color:var(--fg)}
.status.w{background:var(--warn-soft);border-color:var(--warn);color:var(--fg)}
.status.i{background:var(--info-soft);border-color:var(--info);color:var(--fg)}
.status.flash{animation:flash .5s ease-out}
@keyframes flash{from{transform:translateY(4px)}to{transform:none}}
.status .sys{display:none}

.pulse{position:relative;z-index:1;box-shadow:0 0 0 3px var(--mentor-soft),0 0 0 5px var(--mentor)!important;animation:pulse 1.3s ease-in-out 3}
@keyframes pulse{50%{box-shadow:0 0 0 3px var(--mentor-soft),0 0 0 9px transparent}}

/* Monitor NF-e: grade ALV (visual fixo do SAP) */
.nfh{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center;padding:10px 12px;background:#fff;border:1px solid #D0D7DE;border-radius:2px;font:12px/1.2 Arial,var(--gui);color:#32363A}
.nfc{display:flex;align-items:center;gap:6px}
.nfc>span{color:#556270}
.nfc output{min-width:44px;padding:3px 6px;border:1px solid #BFC7CF;background:#F7F9FB;font-variant-numeric:tabular-nums;color:#000}
.nfsrv{margin-left:auto;display:flex;align-items:center;gap:6px;color:#556270}
.alv{border:1px solid #BFC7CF;background:#fff;font:12px/1.2 Arial,var(--gui);color:#000;min-width:0}
.alv-tb{display:flex;align-items:center;gap:1px;padding:3px 4px;background:linear-gradient(#F7F9FB,#E6ECF2);border-bottom:1px solid #BFC7CF;overflow-x:auto;scrollbar-width:none}
.ab{height:23px;min-width:24px;border:1px solid transparent;background:none;border-radius:2px;display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:0 4px;font:12px Arial,var(--gui);color:#000;flex:none;cursor:pointer}
.ab:hover{border-color:#7F9DB9;background:#fff}
.alv-g{overflow:auto;max-height:360px}
.alv table{border-collapse:collapse;width:max-content;min-width:100%}
.alv th{position:sticky;top:0;z-index:1;background:#EEF2F6;border-right:1px solid #D0D7DE;border-bottom:1px solid #BFC7CF;padding:4px 6px;font-weight:normal;text-align:left;white-space:nowrap;color:#1F2D3A}
.alv td{padding:2px 6px;height:22px;border-right:1px solid #E3E8ED;border-bottom:1px solid #E3E8ED;white-space:nowrap;font-variant-numeric:tabular-nums}
.alv tbody tr[data-act]{cursor:pointer}
.alv tbody tr:nth-child(even) td{background:#F5F8FB}
.alv tbody tr[data-act]:hover td{background:#EAF2FB}
.alv tbody tr.on td{background:#CFE2F6}
.alv tr.none td{color:#556270;padding:14px 10px;white-space:normal}
.alv .c{text-align:center}
.alv .r{text-align:right}
.alv td input[type=checkbox]{margin:0;width:13px;height:13px;vertical-align:middle}
.alv td svg{display:block;margin:auto}
.ib{border:0;background:none;padding:0;display:grid;place-items:center;margin:auto;cursor:pointer}
.hist-t{font:bold 12px Arial,var(--gui);padding:6px 8px;background:#EEF2F6;border-bottom:1px solid #BFC7CF}
.nfkey{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:8px 10px;border-top:1px solid #D0D7DE}
.nfkey b{font-weight:normal;color:#556270}
.nfkey #nfkey{font-variant-numeric:tabular-nums;word-spacing:2px}
/* ---------- SAP Fiori (Quartz Light) ---------- */
body{font-size:14px;overflow-x:clip}
code{font-family:var(--code)}
.top{margin-inline:calc(50% - 50vw);padding-block:0;padding-inline:max(16px,calc(50vw - 590px));min-height:48px;background:var(--shell);color:#fff}

<script>
(function(){
'use strict';
const KEY='saptutor-sd-v1';
const $=s=>document.querySelector(s);
const pad=(n,l)=>String(n).padStart(l,'0');
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>(+n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const qf=n=>(+n||0).toLocaleString('pt-BR');
const r2=n=>Math.round(n*100)/100;
const up=v=>String(v??'').trim().toUpperCase();
const num=v=>{const s=String(v??'').trim().replace(/\./g,'').replace(',','.');return s===''?NaN:Number(s)};
const NOW=new Date();
const TODAY=`${pad(NOW.getDate(),2)}.${pad(NOW.getMonth()+1,2)}.${NOW.getFullYear()}`;
const hhmm=()=>{const d=new Date();return `${pad(d.getHours(),2)}:${pad(d.getMinutes(),2)}:${pad(d.getSeconds(),2)}`};

/* ---------- Documentos fiscais brasileiros (dígitos verificadores reais) ---------- */
function cnpj(base){const dv=b=>{const w=b.length===12?[5,4,3,2,9,8,7,6,5,4,3,2]:[6,5,4,3,2,9,8,7,6,5,4,3,2];const r=[...b].reduce((a,d,i)=>a+ +d*w[i],0)%11;return r<2?0:11-r};let b=base;b+=dv(b);b+=dv(b);return b}
const fCNPJ=s=>`${s.slice(0,2)}.${s.slice(2,5)}.${s.slice(5,8)}/${s.slice(8,12)}-${s.slice(12)}`;

function ieRJ(a){const w=[2,7,6,5,4,3,2];const r=[...a].reduce((s,d,i)=>s+ +d*w[i],0)%11;const f=a+(r<=1?0:11-r);return `${f.slice(0,2)}.${f.slice(2,5)}.${f.slice(5,7)}-${f.slice(7)}`}

function calc(kunnr,rows){
  const k=cust(kunnr),ir=k?icmsR(k.REGIO):0;
  const lines=rows.map(r=>{const m=mat(r.MATNR);const p=r.p??(m?price(m.MATNR):0);const q=Number.isFinite(r.q)?r.q:0;const net=r2(q*p);const pr=m?ipiR(m.STEUC):0;return {...r,m,p,q,net,ir,pr,icms:r2(net*ir/100),ipi:r2(net*pr/100)}});
  const t=lines.reduce((a,l)=>({net:a.net+l.net,icms:a.icms+l.icms,ipi:a.ipi+l.ipi}),{net:0,icms:0,ipi:0});
  return {k,ir,lines,...t,tax:r2(t.icms+t.ipi),total:r2(t.net+t.ipi)};
}
function cycle(){
  const o=db().VBAK.at(-1); if(!o) return {};
  const lp=db().LIPS.find(r=>r.VGBEL===o.VBELN); const l=lp&&db().LIKP.find(x=>x.VBELN===lp.VBELN);
  const bp=l&&db().VBRP.find(r=>r.VGBEL===l.VBELN); const b=bp&&db().VBRK.find(x=>x.VBELN===bp.VBELN);
  const nf=b&&db().J_1BNFDOC.find(x=>x.REFKEY===b.VBELN);
  return {o,l,b,nf};
}

function va01Enter(){
  const d=D.va01,A=up(d.AUART),VK=up(d.VKORG),VT=up(d.VTWEG),SP=up(d.SPART);
  if(!A||!VK||!VT||!SP){markBad('#'+fid(!A?'va01.AUART':!VK?'va01.VKORG':!VT?'va01.VTWEG':'va01.SPART'));return msg('e','Preencher todos os campos obrigatórios')}
  if(A!=='OR'){markBad('#f-va01-AUART');return msg('e',['RE','FD','KB','CS','SO','CR','DR'].includes(A)?`Tipo de documento de vendas ${A} não está liberado neste cenário. Use OR (ordem padrão)`:`Tipo de documento de vendas ${A} não existe`)}
  if(!db().TVKO.some(r=>r.VKORG===VK)){markBad('#f-va01-VKORG');return msg('e',`Organização de vendas ${VK} não existe`)}
  if(!db().TVTW.some(r=>r.VTWEG===VT)){markBad('#f-va01-VTWEG');return msg('e',`Canal de distribuição ${VT} não existe`)}
  if(!db().TSPA.some(r=>r.SPART===SP)){markBad('#f-va01-SPART');return msg('e',`Setor de atividade ${SP} não existe`)}
  clearMsg();go('VA01_2');
}
function va01Check(quiet){
  const d=D.va01b,K=up(d.KUNNR);
  if(!K){markBad('#f-va01b-KUNNR');return msg('e','Preencher todos os campos obrigatórios: Emissor da ordem')}
  if(!cust(K)){markBad('#f-va01b-KUNNR');mentor('cust_err');return msg('e',`Emissor da ordem ${K} não foi criado para a área de vendas ${up(D.va01.VKORG)}/${up(D.va01.VTWEG)}/${up(D.va01.SPART)}`)}
  const rows=d.items.map((it,i)=>({i,pos:pad((i+1)*10,6),M:up(it.MATNR),W:up(it.WERKS),q:num(it.KWMENG),raw:String(it.KWMENG).trim()})).filter(r=>r.M||r.raw);
  if(!rows.length){markBad('#f-va01b-items-0-MATNR');return msg('e','Nenhum item foi entrado. Entre pelo menos um material')}
  for(const r of rows){
    const b=`#f-va01b-items-${r.i}-`;
    if(!r.M){markBad(b+'MATNR');return msg('e',`Entre o material no item ${r.pos}`)}
    if(!db().T001W.some(x=>x.WERKS===r.W)){markBad(b+'WERKS');return msg('e',`Centro ${r.W||'(vazio)'} não existe`)}
    if(!mat(r.M)||!marc(r.M,r.W)){markBad(b+'MATNR');mentor('mat_err');return msg('e',`Código de material ${r.M} não cadastrado no centro ${r.W}`)}
    if(!Number.isInteger(r.q)||r.q<=0){markBad(b+'KWMENG');return msg('e',`Entre uma quantidade válida para o item ${r.pos}`)}
  }
  const short=rows.find(r=>r.q>atp(r.M));
  if(short){const a=atp(short.M);msg('w',`Disponibilidade: ${qf(Math.max(a,0))} CX de ${short.M} disponíveis em ${short.W}. O item ${short.pos} será confirmado parcialmente`)}
  else if(!quiet){isC()?clearMsg():msg('i','Itens verificados: preço PR00 e impostos determinados')}
  return {K,rows};
}
function va01Save(){
  const ok=va01Check(true);if(!ok)return;

function vl01Enter(){
  const d=D.vl01,VS=up(d.VSTEL),DT=String(d.LEDAT).trim(),VB=up(d.VBELN);
  if(!VS||!DT||!VB){markBad('#'+fid(!VS?'vl01.VSTEL':!DT?'vl01.LEDAT':'vl01.VBELN'));return msg('e','Preencher todos os campos obrigatórios')}
  if(!db().TVST.some(r=>r.VSTEL===VS)){markBad('#f-vl01-VSTEL');return msg('e',`Ponto de expedição ${VS} não existe`)}
  if(!/^\d{2}\.\d{2}\.\d{4}$/.test(DT)){markBad('#f-vl01-LEDAT');return msg('e','Entre a data no formato DD.MM.AAAA')}
  const o=db().VBAK.find(x=>x.VBELN===VB);
  if(!o){markBad('#f-vl01-VBELN');if(db().LIKP.some(x=>x.VBELN===VB))return msg('e',`${VB} é uma remessa. Aqui a referência é a ordem de venda`);return msg('e',`Documento de vendas ${VB} não existe`)}
  const its=db().VBAP.filter(i=>i.VBELN===VB&&openQty(i)>0);
  if(!its.length){markBad('#f-vl01-VBELN');return msg('e',`Ordem ${VB} não contém itens relevantes para remessa (já fornecida)`)}
  const items=its.map((it,i)=>{const open=openQty(it),av=Math.max(stock(it.MATNR,it.WERKS),0);return {POSNR:pad((i+1)*10,6),VGPOS:it.POSNR,MATNR:it.MATNR,ARKTX:it.ARKTX,WERKS:it.WERKS,open,LFIMG:Math.min(open,av),PIKMG:'',LGORT:'DEP1'}}).filter(x=>x.LFIMG>0);
  if(!items.length){mentor('deficit');return msg('e',`Déficit de estoque de utilização livre: ${its[0].MATNR} ${its[0].WERKS} DEP1`)}
  D.vl01b={order:VB,KUNNR:o.KUNNR,VSTEL:VS,LEDAT:DT,items};D.tabs.vl='sint';
  if(items.some(x=>x.LFIMG<x.open))msg('w','Quantidade de remessa reduzida por falta de estoque livre');else clearMsg();
  go('VL01N_2');
}
function vl01Check(quiet){
  if(isC()&&D.tabs.vl!=='pick'&&D.vl01b.items.some(it=>num(it.PIKMG)!==it.LFIMG||up(it.LGORT)!=='DEP1')){D.tabs.vl='pick';render()}
  for(const [i,it] of D.vl01b.items.entries()){
    const L=up(it.LGORT),b=`#f-vl01b-items-${i}-`,p=num(it.PIKMG);
    if(!db().T001L.some(x=>x.WERKS===it.WERKS&&x.LGORT===L)){markBad(b+'LGORT');return msg('e',`Depósito ${L||'(vazio)'} não existe no centro ${it.WERKS}`)}
    if(String(it.PIKMG).trim()===''||!Number.isFinite(p)){markBad(b+'PIKMG');return msg('e',`Entre a quantidade de picking do item ${it.POSNR}`)}
    if(p!==it.LFIMG){markBad(b+'PIKMG');mentor('pick_mismatch');return msg('e',`Quantidade de picking (${qf(p)}) difere da quantidade fornecida (${qf(it.LFIMG)}) no item ${it.POSNR}`)}
    const s=stock(it.MATNR,it.WERKS,L);
    if(s<it.LFIMG){mentor('deficit');return msg('e',`Déficit de estoque de utilização livre de ${qf(it.LFIMG-s)} CX: ${it.MATNR} ${it.WERKS} ${L}`)}
  }
  if(!quiet)msg('i','Picking completo. Remessa pronta para a saída de mercadoria');
  return true;
}
function pgi(){
  if(!vl01Check(true))return;
  const r=D.vl01b,vb=String(S.nr.VL++),mb=String(S.nr.MB++),it0=r.items[0];
  const from=stock(it0.MATNR,it0.WERKS,up(it0.LGORT));

  db().MKPF.push({MBLNR:mb,MJAHR:NOW.getFullYear(),BUDAT:TODAY,USNAM:ernam(),XBLNR:vb});
  r.items.forEach((x,i)=>{const L=up(x.LGORT);
    db().LIPS.push({VBELN:vb,POSNR:x.POSNR,MATNR:x.MATNR,ARKTX:x.ARKTX,LFIMG:x.LFIMG,PIKMG:num(x.PIKMG),VRKME:'CX',WERKS:x.WERKS,LGORT:L,VGBEL:r.order,VGPOS:x.VGPOS});
    db().MSEG.push({MBLNR:mb,ZEILE:pad(i+1,4),BWART:'601',MATNR:x.MATNR,WERKS:x.WERKS,LGORT:L,MENGE:x.LFIMG,MEINS:'CX',KUNNR:r.KUNNR});
    mard(x.MATNR,x.WERKS,L).LABST-=x.LFIMG;

    db().VBFA.push({VBELV:vb,POSNV:x.POSNR,VBELN:mb,POSNN:pad(i+1,6),VBTYP_N:'R',RFMNG:x.LFIMG});

  go('VL01N');msg('s',`Remessa ${vb} gravada · Saída de mercadoria ${mb} registrada`);mentor('pgi_done',{from,to,mat:it0.MATNR});
}
function billCalc(l){

function authorize(doc,delay){
  setTimeout(()=>{

  },delay);
}

function go(route){

  D.confirmReset=false;D.route=route;closeSug();render();
  window.scrollTo(0,0);
  const k=TIP_FOR[route];if(k&&!(route==='home'&&isC()))mentor(k);

function runCommand(raw){
  let c=up(raw);
  if(!c)return R[D.route].enter?.();
  if(/^\/[NO]/.test(c))c=c.slice(2);
  else if(c.startsWith('/'))return msg('e',`Função ${c} não é possível`);
  if(c===''||c==='SMEN'||c==='S000'){clearMsg();return go('home')}
  const map={VA01:'VA01',VL01N:'VL01N',VF01:'VF01',J1BNFE:'J1BNFE',SE16N:'SE16N',SE16:'SE16N'};
  if(map[c]){clearMsg();return go(map[c])}
  if(['VA02','VA03','VA05','VL02N','VL03N','VF02','VF03','VF04','F-28','FBL5N','MMBE','MD04','VK11','VK13','XD01','XD03','MM01','MM03','VD03','CO09'].includes(c))return msg('w',`A transação ${c} existe no SAP, mas não faz parte deste cenário`);
  msg('e',`Transação ${c} não existe`);
}

const svg=k=>`<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">${SV[k]}</svg>`;
const MENUS={home:['Menu','Processar','Favoritos','Suplementos','Sistema','Ajuda'],VA01:['Ordem de venda','Processar','Avançar','Ambiente','Sistema','Ajuda'],VL01N:['Fornecimento de saída','Processar','Avançar','Ambiente','Sistema','Ajuda'],VF01:['Documento de faturamento','Processar','Avançar','Ambiente','Sistema','Ajuda'],J1BNFE:['Nota fiscal','Processar','Avançar','Ambiente','Sistema','Ajuda'],SE16N:['Tabela','Processar','Avançar','Configurações','Sistema','Ajuda']};
const APPTB={
  home:[['umenu','Menu do usuário','na'],['smenu','Menu SAP','na'],0,['fav','Favoritos','na'],['omenu','Outro menu','na','Outro menu'],0,['favadd','Inserir nos favoritos','na'],['favchg','Modificar favoritos','na'],['favdel','Eliminar favoritos','na'],0,['down','Expandir subárvore','na'],['up','Comprimir subárvore','na'],0,['role','Criar função','na','Criar função'],['users','Atribuir usuários','','Atribuir usuários',1],['book','Documentação','','Documentação',1]],
  VA01:[['doc','Criar com referência','na','Criar c/referência'],0,['hdr','Vendas','enter','Vendas'],['items','Síntese de itens','enter','Síntese de itens'],['doc','Detalhe de item','','Detalhe de item',1],['part','Encomendante','','Encomendante',1]],
  VA01_2:[['items','Inserir item','additem','Inserir item'],['chk','Verificar','enter','Verificar'],0,['hdr','Cabeçalho','na','Cabeçalho'],['price','Condições','enter','Condições']],
  VL01N:[['doc','Criar sem referência à ordem','','Sem referência à ordem',1]],
  VL01N_2:[['truck','Registrar saída de mercadoria','pgi','Registrar SM'],['chk','Verificar','enter','Verificar'],0,['items','Picking','enter','Picking']],
  VF01:[['items','Síntese de documentos de faturamento','enter','Síntese doc.faturamento'],['omenu','Lista de seleção','','Lista de seleção',1]],
  J1BNFE:[['exec','Atualizar','enter','Atualizar'],['omenu','Parâmetros de seleção NF-e','na','Parâmetros de seleção NF-e'],['down','Mais','na','Mais']],
  SE16N:[['exec','Executar (F8)','enter','Executar']]
};
function chromeApp(){
  const g=GRP[D.route]||D.route;
  const tabs=[['home','Início'],['VA01','VA01'],['VL01N','VL01N'],['VF01','VF01'],['J1BNFE','NF-e'],['SE16N','SE16N']];
  return `<header class="top"><div class="brand"><span class="logo">SD</span><div><b>SAPTutor SD</b><small>Venda padrão · Cenário Brasil</small></div></div>
  <div class="top-r"><div class="seg" role="group" aria-label="Modo de tela"><button data-act="mode" data-mode="app" aria-pressed="true">SAP Fiori</button><button data-act="mode" data-mode="classic" aria-pressed="false">SAP GUI</button></div><button class="ic" data-act="mentor" aria-label="Mostrar a dica do mentor para esta tela">?</button></div></header>
  <nav class="tabs" aria-label="Transações">${tabs.map(([r,l])=>`<button data-act="go" data-to="${r}" class="${g===r?'on':''}" ${g===r?'aria-current="page"':''}>${l}</button>`).join('')}</nav>`;
}
function chromeClassic(r){
  const k=D.route,g=GRP[k]||k,canSave=!!R[k].save;
  const b=(ic,t,act,dis)=>`<button class="sb" ${act&&!dis?`data-act="${act}"`:''} title="${t}" aria-label="${t}" ${dis?'disabled':''}>${svg(ic)}</button>`;
  const a=x=>x===0?'<span class="sep"></span>':`<button class="sa" ${x[2]&&!x[4]?`data-act="${x[2]}"`:''} title="${x[1]}" ${x[3]?'':`aria-label="${x[1]}"`} ${x[4]?'disabled':''}>${svg(x[0])}${x[3]?`<span>${x[3]}</span>`:''}</button>`;
  const menus=(MENUS[g]||MENUS.home).map(m=>`<span><u>${m[0]}</u>${m.slice(1)}</span>`).join('');
  return `<div class="sg">
  <div class="sg-menu"><span class="wi" aria-hidden="true">${svg('win')}</span>${menus}<div class="r"><button class="sg-mode" data-act="mode" data-mode="app" title="Mudar para a interface SAP Fiori">SAP Fiori</button><span class="wc" aria-hidden="true"><i>_</i><i>□</i><i>×</i></span></div></div>
  <div class="sg-tool">${b('enter','Enter','enter')}<div class="cmd"><input id="okcode" aria-label="Campo de comando" autocomplete="off" spellcheck="false"><span class="dd" aria-hidden="true">${svg('dd')}</span></div>${b('coll','Ocultar campo de comando','na')}${b('save','Gravar (Ctrl+S)','save',!canSave)}<span class="sep"></span>${b('back','Voltar (F3)','back')}${b('exit','Encerrar (Shift+F3)','home')}${b('cancel','Cancelar (F12)','back')}<span class="sep"></span>${b('print','Imprimir (Ctrl+P)','na',true)}${b('find','Procurar (Ctrl+F)','na',k!=='SE16N')}${b('findn','Continuar procura','na',true)}<span class="sep"></span>${b('pfirst','Primeira página','na',true)}${b('pprev','Página anterior','na',true)}${b('pnext','Página seguinte','na',true)}${b('plast','Última página','na',true)}<span class="sep"></span>${b('newwin','Criar nova sessão','na')}${b('short','Criar atalho no desktop','na')}<span class="sep"></span>${b('help','Ajuda: mentor (F1)','mentor')}${b('layout','Configurar layout local (Alt+F12)','na')}</div>
  <div class="sg-title"><h1>${r.title}</h1></div>
  <div class="sg-app">${(APPTB[k]||[]).map(a).join('')}</div></div>`;
}
function render(){
  closeSug();
  document.documentElement.classList.toggle('is-classic',isC());
  const r=R[D.route];
  $('#chrome').innerHTML=isC()?chromeClassic(r):chromeApp(r);
  $('#screen').innerHTML=r.render();
  renderStatus();showMentor();
}

/* ---------- Auto-completar ---------- */
let SG=null;
function openSug(el,all){
  closeSug();
  const t=el.dataset.suggest,v=up(el.value);let list=SRC[t]();
  if(!all&&v){if(list.some(o=>o.k===v))return;list=list.filter(o=>o.k.startsWith(v)||o.t.toUpperCase().includes(v))}
  if(!list.length)return;
  list=list.slice(0,6);
  const ul=document.createElement('ul');ul.className='sug';ul.setAttribute('role','listbox');
  ul.innerHTML=(SRC_H[t]?`<li class="sug-h" aria-hidden="true">${SRC_H[t]}</li>`:'')+list.map((o,i)=>`<li role="option" data-i="${i}"><b>${e(o.k)}</b><span>${e(o.t)}</span>${o.s?`<small>${e(o.s)}</small>`:''}</li>`).join('');
  document.body.appendChild(ul);
  const rc=el.getBoundingClientRect(),w=Math.min(Math.max(rc.width,280),window.innerWidth-24);
  ul.style.width=w+'px';ul.style.left=Math.max(12,Math.min(rc.left,window.innerWidth-w-12))+'px';
  const below=window.innerHeight-rc.bottom;
  if(below<200&&rc.top>below){ul.style.bottom=(window.innerHeight-rc.top+4)+'px'}else{ul.style.top=(rc.bottom+4)+'px'}
  SG={el,list,i:-1,ul};
}
function closeSug(){if(SG){SG.ul.remove();SG=null}}
function pickSug(i){if(!SG)return;const {el,list}=SG;el.value=list[i].k;closeSug();el.dispatchEvent(new Event('input',{bubbles:true}));closeSug()}
function moveSug(d){if(!SG)return;SG.i=(SG.i+d+SG.list.length)%SG.list.length;SG.ul.querySelectorAll('li[role=option]').forEach((li,i)=>li.classList.toggle('act',i===SG.i))}

/* ---------- Eventos ---------- */
const ACT={
  go:b=>{clearMsg();go(b.dataset.to)},
  enter:()=>{const ok=$('#okcode');if(ok&&ok.value.trim())return runCommand(ok.value);R[D.route].enter?.()},
  save:()=>R[D.route].save?R[D.route].save():msg('w','Gravar não é possível nesta tela'),
  back:()=>{clearMsg();R[D.route].back?R[D.route].back():go('home')},
  home:()=>{clearMsg();go('home')},
  mode:b=>{if(S.mode===b.dataset.mode)return;S.mode=b.dataset.mode;persist();render();if(isC())mentor('classic_first')},
  additem:()=>{if(D.route!=='VA01_2')return;D.va01b.items.push({MATNR:'',KWMENG:'',WERKS:'BR01'});render()},
  delitem:b=>{D.va01b.items.splice(+b.dataset.i,1);render()},
  pgi:()=>{if(D.route==='VL01N_2')pgi()},
  mentor:()=>{const k=isC()&&D.route==='home'?'classic_first':TIP_FOR[D.route]||'home';mentor(k,{},true)},
  closementor:()=>{MENTOR=null;showMentor()},
  na:b=>msg('w',`Função "${b.getAttribute('title')}" não está disponível no simulador`),
  nfsel:b=>{D.nfSel=b.dataset.doc;render()},
  tab:b=>{D.tabs[b.dataset.k]=b.dataset.tab;render()},
  danfe:b=>{const d=b.dataset.doc;D.nfSel=d;D.nfDanfe=D.nfDanfe===d?null:d;render();if(D.nfDanfe)requestAnimationFrame(()=>document.getElementById('danfe')?.scrollIntoView({behavior:'smooth',block:'start'}))},
  copykey:()=>{const t=$('#nfkey').textContent.replace(/\s/g,'');const sel=()=>{const r=document.createRange();r.selectNodeContents($('#nfkey'));const s=getSelection();s.removeAllRanges();s.addRange(r)};
    try{navigator.clipboard.writeText(t).then(()=>msg('s','Chave de acesso copiada'),()=>{sel();msg('i','Chave selecionada. Use Ctrl+C para copiar')})}catch(_){sel();msg('i','Chave selecionada. Use Ctrl+C para copiar')}},
  reset:()=>{if(!D.confirmReset){D.confirmReset=true;render();setTimeout(()=>{if(D.confirmReset){D.confirmReset=false;if(D.route==='home')render()}},5000);return}
    const keep={name:S.name,mode:S.mode};S=seed();S.name=keep.name;S.mode=keep.mode;persist();
    D.va01b=freshVA01b();D.vl01b=null;D.vl01.VBELN='';D.vf01={VBELN:'',FKART:'F2',preview:false};D.result=null;D.confirmReset=false;MENTOR=null;
    go('home');msg('s','Dados mestres restaurados: estoque FERT-900 de volta a 200 CX')}
};
document.addEventListener('mousedown',ev=>{if(ev.target.closest('.sug'))ev.preventDefault()});
document.addEventListener('click',ev=>{
  const li=ev.target.closest('.sug li[role=option]');if(li){pickSug(+li.dataset.i);return}
  const b=ev.target.closest('[data-act]');if(!b)return;
  ACT[b.dataset.act]?.(b);
});
document.addEventListener('input',ev=>{
  const el=ev.target;if(!el.dataset||!el.dataset.bind)return;
  el.classList.remove('bad');
  setPath(el.dataset.bind,el.value);
  if(el.dataset.bind==='se16.tab'){D.se16.run=false;if(el.tagName==='SELECT'){render();return}}
  if(el.dataset.bind.startsWith('vf01'))D.vf01.preview=false;
  if(el.dataset.suggest){const d=document.getElementById(el.id+'-d');if(d)d.textContent=descOf(el.dataset.suggest,el.value);if(document.activeElement===el)openSug(el,!el.value)}
  if(D.route==='VA01_2')updatePricing();
});
document.addEventListener('focusin',ev=>{const el=ev.target;if(el.dataset&&el.dataset.suggest)openSug(el,!el.value||!!SRC_H[el.dataset.suggest])});
document.addEventListener('focusout',ev=>{if(SG&&ev.target===SG.el)setTimeout(()=>{if(SG&&document.activeElement!==SG.el)closeSug()},150)});
window.addEventListener('resize',closeSug);
window.addEventListener('scroll',()=>{if(SG&&!SG.ul.matches(':hover'))closeSug()},{passive:true});
document.addEventListener('keydown',ev=>{
  const el=ev.target;
  if(SG&&el===SG.el){
    if(ev.key==='ArrowDown'){ev.preventDefault();return moveSug(1)}
    if(ev.key==='ArrowUp'){ev.preventDefault();return moveSug(-1)}
    if(ev.key==='Escape'){return closeSug()}
    if(ev.key==='Enter'&&SG.i>=0){ev.preventDefault();return pickSug(SG.i)}
  }
  if(ev.key==='F4'&&el.dataset&&el.dataset.suggest){ev.preventDefault();return openSug(el,true)}
  if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='s'){ev.preventDefault();closeSug();return ACT.save()}
  if(ev.key==='F3'){ev.preventDefault();return ev.shiftKey?ACT.home():ACT.back()}
  if(ev.key==='F12'){ev.preventDefault();return ACT.back()}
  if(ev.key==='F8'){ev.preventDefault();return R[D.route].enter?.()}
  if(ev.key==='F1'){ev.preventDefault();return ACT.mentor()}
  if(ev.key==='Enter'&&el.id==='okcode'){ev.preventDefault();const v=el.value;el.value='';return runCommand(v)}
  if(ev.key==='Enter'&&el.tagName==='INPUT'&&el.dataset.bind&&el.dataset.bind!=='name'){ev.preventDefault();closeSug();R[D.route].enter?.()}
});

/* ---------- Início ---------- */
render();
db().J_1BNFDOC.filter(n=>n.CODE!=='100').forEach(n=>authorize(n.DOCNUM,0));
mentor(isC()?'classic_first':'home');
})();
</script>
